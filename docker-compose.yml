services:
  postgres:
    image: postgres:16-alpine
    container_name: wardrobe-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wardrobe}
      POSTGRES_USER: ${POSTGRES_USER:-wardrobe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wardrobe_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-wardrobe_user} -d ${POSTGRES_DB:-wardrobe}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wardrobe-network

  redis:
    image: redis:7-alpine
    container_name: wardrobe-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - wardrobe-network

  minio:
    image: quay.io/minio/minio:latest
    container_name: wardrobe-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wardrobe-network

  create-buckets:
    image: quay.io/minio/mc:latest
    container_name: wardrobe-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET_NAME:-wardrobe-storage};
      /usr/bin/mc anonymous set download myminio/${MINIO_BUCKET_NAME:-wardrobe-storage};
      exit 0;
      "
    networks:
      - wardrobe-network

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: wardrobe-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-wardrobe}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-wardrobe_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-wardrobe_password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      STORAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      STORAGE_S3_BUCKET: ${MINIO_BUCKET_NAME:-wardrobe-storage}
      STORAGE_S3_REGION: us-east-1
      AI_SERVICE_URL: http://ai-service:8000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev_internal_secret_key_12345}
      TRYON_DAILY_LIMIT: ${TRYON_DAILY_LIMIT:-5}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - wardrobe-network

  ai-service:
    build:
      context: .
      dockerfile: docker/ai-service.Dockerfile
    container_name: wardrobe-ai-service
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-wardrobe-storage}
      BACKEND_CALLBACK_URL: http://backend:8080/api/internal/try-ons/callback
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev_internal_secret_key_12345}
      # Fashn.ai VTON provider (leave blank to use enhanced mock mode)
      FASHN_API_KEY: ${FASHN_API_KEY:-}
      FASHN_MODEL: ${FASHN_MODEL:-tryon}
      FASHN_POLL_TIMEOUT_SECONDS: ${FASHN_POLL_TIMEOUT_SECONDS:-120}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - wardrobe-network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: wardrobe-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - wardrobe-network

networks:
  wardrobe-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
